[project]
name = "sentinelai-data-pipeline"
version = "0.1.0"
description = "OWASP/CVE ingestion, chunking, and vector indexing for SentinelAI RAG"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
sentinelai-pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=pipeline --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/cli.py", "pipeline/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
